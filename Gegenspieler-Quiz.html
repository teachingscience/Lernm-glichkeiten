<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gegenspieler-Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: eine zentrale Spalte – Frage oben, Bild in der Mitte, vier Antworten darunter */
  --bg: #F1F3F6;
  --surface: #FFFFFF;
  --ink: #1C2230;
  --muted: #5B6476;
  --accent: #8C1D3A;
  --line: #D8DDE5;
  --ok: #1E7B4C;
  --ok-bg: #E3F4EA;
  --bad: #B8321E;
  --bad-bg: #FBE7E3;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141821; --surface: #1E2430; --ink: #EEF1F6; --muted: #A3ACBD; --accent: #F07A97;
    --line: #333C4C; --ok: #5FD39A; --ok-bg: #173527; --bad: #FF8A73; --bad-bg: #3E1E19; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141821; --surface: #1E2430; --ink: #EEF1F6; --muted: #A3ACBD; --accent: #F07A97;
  --line: #333C4C; --ok: #5FD39A; --ok-bg: #173527; --bad: #FF8A73; --bad-bg: #3E1E19; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 18px; line-height: 1.5; }
.wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 26px; margin: 0; letter-spacing: -0.01em; }
h1 span { color: var(--accent); }
.status { display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 15px; color: var(--muted); }
.pill b { color: var(--ink); }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
.question { font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 1.3; text-align: center; margin: 4px 0 0; text-wrap: balance; }
.figure { background: #FFFFFF; border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; justify-content: center; }
.imgbox { position: relative; width: 100%; max-width: 640px; }
.imgbox img { display: block; width: 100%; height: auto; }
.imgbox svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .answers { grid-template-columns: 1fr; } .question { font-size: 21px; } }
.ans { display: flex; align-items: center; gap: 12px; text-align: left; font: inherit; color: var(--ink); background: var(--surface);
  border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; min-height: 64px; transition: border-color .15s, background .15s, transform .1s; }
.ans:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
.ans:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ans .key { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-family: var(--font-display);
  background: var(--bg); border: 1px solid var(--line); }
.ans:disabled { cursor: default; }
.ans.correct { border-color: var(--ok); background: var(--ok-bg); }
.ans.correct .key { background: var(--ok); color: #fff; border-color: var(--ok); }
.ans.wrong { border-color: var(--bad); background: var(--bad-bg); }
.ans.wrong .key { background: var(--bad); color: #fff; border-color: var(--bad); }
.ans.dim { opacity: .55; }
.feedback { border-radius: 12px; padding: 14px 16px; border-left: 6px solid var(--line); background: var(--surface); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.feedback[hidden] { display: none; }
.feedback.ok { border-left-color: var(--ok); }
.feedback.bad { border-left-color: var(--bad); }
.feedback p { margin: 0; flex: 1 1 340px; }
.feedback strong { display: block; font-family: var(--font-display); font-size: 20px; }
.feedback.ok strong { color: var(--ok); }
.feedback.bad strong { color: var(--bad); }
.btn { font: inherit; font-weight: 700; border: none; border-radius: 10px; padding: 12px 20px; background: var(--accent); color: #fff; cursor: pointer; }
:root[data-theme="dark"] .btn { color: #1C2230; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #1C2230; } }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.result { text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px 20px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.result[hidden], #quiz[hidden] { display: none; }
.score { font-family: var(--font-display); font-weight: 800; font-size: 56px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.review { list-style: none; margin: 0; padding: 0; width: 100%; max-width: 620px; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.review li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--bg); }
.review .tag { font-weight: 700; color: var(--ok); }
.review .tag.x { color: var(--bad); }
footer { font-size: 13px; color: var(--muted); text-align: center; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
@media (prefers-reduced-motion: no-preference) { .ring { animation: pulse 1.4s ease-in-out infinite; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Gegenspieler-<span>Quiz</span></h1>
    <div class="status">
      <span class="pill">Frage <b id="num">1</b> von <b id="total">10</b></span>
      <span class="pill">Punkte <b id="pts">0</b></span>
    </div>
  </header>
  <div class="bar" aria-hidden="true"><i id="progress"></i></div>

  <main id="quiz">
    <div style="display:flex;flex-direction:column;gap:18px">
      <h2 class="question" id="question"></h2>
      <div class="figure"><div class="imgbox" id="imgbox"></div></div>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback" hidden role="status" aria-live="polite">
        <p id="fbtext"></p>
        <button class="btn" id="next" type="button">Nächste Frage</button>
      </div>
    </div>
  </main>

  <section class="result" id="result" hidden>
    <div class="score" id="score"></div>
    <p id="verdict" style="margin:0;font-size:20px"></p>
    <ul class="review" id="review"></ul>
    <button class="btn" id="restart" type="button">Quiz neu starten</button>
  </section>

  <footer>Abbildungen: GIDA 2019, „Muskel &amp; Energie I“, Arbeitsblätter Kl. 5+6</footer>
</div>

function ring(x, y, r) {
  return `<circle class="ring" cx="${x}" cy="${y}" r="${r}" fill="rgba(255,196,0,.18)" stroke="#E8A300" stroke-width="7"/>`;
}
function pointer(x, y, r, bx, by) {
  const dx = x - bx, dy = y - by, d = Math.hypot(dx, dy);
  const ex = x - dx / d * (r + 4), ey = y - dy / d * (r + 4);
  return `<line x1="${bx}" y1="${by}" x2="${ex}" y2="${ey}" stroke="#E8A300" stroke-width="6" stroke-linecap="round"/>` + ring(x, y, r) +
    `<circle cx="${bx}" cy="${by}" r="30" fill="#E8A300"/><text x="${bx}" y="${by + 13}" text-anchor="middle" font-size="38" font-weight="700" font-family="Atkinson Hyperlegible, sans-serif" fill="#1C2230">?</text>`;
}

const $ = id => document.getElementById(id);
let order = [], idx = 0, points = 0, log = [];

function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function start() {
  order = QUESTIONS.map(q => ({ ...q, opts: shuffle(q.a.map((t, i) => ({ t, ok: i === 0 }))) }));
  idx = 0; points = 0; log = [];
  $("total").textContent = order.length;
  $("result").hidden = true; $("quiz").hidden = false;
  show();
}

function show() {
  const q = order[idx];
  $("num").textContent = idx + 1;
  $("pts").textContent = points;
  $("progress").style.width = (idx / order.length * 100) + "%";
  $("question").textContent = q.q;
  const [w, h] = SIZE[q.img];
  $("imgbox").innerHTML = `<img src="data:image/jpeg;base64,${IMG[q.img]}" width="${w}" height="${h}" alt="Abbildung zur Frage ${idx + 1}">` +
    (q.mark ? `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true">${q.mark}</svg>` : "");
  const box = $("answers"); box.innerHTML = "";
  q.opts.forEach((o, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "ans"; b.id = "ans-" + i;
    b.innerHTML = `<span class="key">${"ABCD"[i]}</span><span></span>`;
    b.lastChild.textContent = o.t;
    b.addEventListener("click", () => answer(i));
    box.appendChild(b);
  });
  $("feedback").hidden = true;
  $("next").textContent = idx === order.length - 1 ? "Ergebnis anzeigen" : "Nächste Frage";
}

function answer(i) {
  const q = order[idx], chosen = q.opts[i];
  [...$("answers").children].forEach((b, k) => {
    b.disabled = true;
    if (q.opts[k].ok) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  if (chosen.ok) points++;
  log.push({ q: q.q, ok: chosen.ok, right: q.a[0] });
  $("pts").textContent = points;
  const fb = $("feedback");
  fb.className = "feedback " + (chosen.ok ? "ok" : "bad");
  $("fbtext").innerHTML = `<strong>${chosen.ok ? "Richtig!" : "Leider falsch."}</strong>`;
  $("fbtext").append(document.createTextNode(q.why));
  fb.hidden = false;
  $("next").focus();
}

function next() {
  if (idx < order.length - 1) { idx++; show(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  else finish();
}

function finish() {
  $("progress").style.width = "100%";
  $("quiz").hidden = true; $("result").hidden = false;
  $("score").textContent = `${points} / ${order.length}`;
  const v = points === order.length ? "Super! Du kennst dich mit Gegenspielern bestens aus."
    : points >= 7 ? "Gut gemacht! Schau dir die falschen Fragen noch einmal an."
    : "Schau dir die Erklärungen noch einmal an und versuch es erneut.";
  $("verdict").textContent = v;
  $("review").innerHTML = "";
  log.forEach((l, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="tag ${l.ok ? "" : "x"}">${l.ok ? "✓" : "✗"} ${i + 1}.</span> `;
    li.append(document.createTextNode(l.q + (l.ok ? "" : " Richtig: " + l.right)));
    $("review").appendChild(li);
  });
  $("restart").focus();
}

$("next").addEventListener("click", next);
$("restart").addEventListener("click", start);
start();
</script>
</body>
</html>
